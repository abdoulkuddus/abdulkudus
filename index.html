<!DOCTYPE html>
<html lang="ha"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f">
<title>ABDULKUDUS</title>
<style>
:root{--bg:#efeae2;--hd:#0b6b4f;--me:#d9fdd3;--ot:#fff;--tx:#111;--mu:#667;--bar:#f6f6f6}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--hd:#123f33;--me:#005c4b;--ot:#202c33;--tx:#e9edef;--mu:#8696a0;--bar:#1f2c34}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
#chat,#auth{height:100%;display:none;flex-direction:column}
header{background:var(--hd);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:16px;padding:4px 12px;font-size:13px}
#list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:7px 10px;border-radius:10px;background:var(--ot);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{background:var(--me);align-self:flex-end}
.n{font-size:12px;font-weight:600;color:#0b8f6a;margin-bottom:2px}
.t{font-size:11px;color:var(--mu);text-align:right;margin-top:2px}
#f{display:flex;gap:8px;padding:8px;background:var(--bar)}
input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid #8884;font-size:16px;background:var(--ot);color:var(--tx)}
button.p{border:0;border-radius:22px;background:var(--hd);color:#fff;padding:12px 18px;font-size:16px}
#auth{justify-content:center;padding:24px;gap:12px;max-width:420px;margin:auto}
#auth h1{text-align:center;color:var(--hd);margin:0 0 8px}
#auth input{border-radius:10px}
#err{color:#d33;font-size:14px;min-height:18px;text-align:center}
#sw{background:none;border:0;color:var(--hd);font-size:15px;text-decoration:underline}
</style></head><body>

<div id="auth">
  <h1>ABDULKUDUS</h1>
  <input id="name" placeholder="Sunanka" autocomplete="name">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Kalmar sirri (aƙalla haruffa 6)" autocomplete="current-password">
  <div id="err"></div>
  <button class="p" id="go">Yi rajista</button>
  <button id="sw">Ina da account. Shiga</button>
</div>

<div id="chat">
  <header><span>ABDULKUDUS</span><button id="out">Fita</button></header>
  <div id="list"></div>
  <form id="f"><input id="i" placeholder="Rubuta saƙo..." autocomplete="off"><button class="p">Aika</button></form>
</div>

<script type="module">
/* ====== 1. SANYA BAYANAN FIREBASE NAKA A NAN ====== */
const firebaseConfig = {
  apiKey: "AIzaSyD_L97o6_50K6t5RTWoG3j0KBM1V3ZvAk0",
  authDomain: "abdul-qm.firebaseapp.com",
  projectId: "abdul-qm",
  storageBucket: "abdul-qm.firebasestorage.app",
  messagingSenderId: "646516246453",
  appId: "1:646516246453:web:52648fdd54ec1193bc3bfc"
};
/* ================================================== */

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let signup=true,unsub=null;

function mode(){
  $('name').style.display=signup?'':'none';
  $('go').textContent=signup?'Yi rajista':'Shiga';
  $('sw').textContent=signup?'Ina da account. Shiga':'Ba ni da account. Yi rajista';
  $('err').textContent='';
}
$('sw').onclick=()=>{signup=!signup;mode()};
mode();

const msgErr=c=>({
  'auth/email-already-in-use':'An riga an yi rajista da wannan email.',
  'auth/invalid-email':'Email ɗin bai dace ba.',
  'auth/weak-password':'Kalmar sirri ta yi rauni. Ka sa aƙalla haruffa 6.',
  'auth/invalid-credential':'Email ko kalmar sirri ba daidai ba ne.',
  'auth/network-request-failed':'Babu intanet.'
}[c]||'Wani kuskure ya faru. Ka sake gwadawa.');

$('go').onclick=async()=>{
  const e=$('email').value.trim(),p=$('pass').value,n=$('name').value.trim();
  if(signup&&!n){$('err').textContent='Ka rubuta sunanka.';return}
  try{
    if(signup){const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n})}
    else await signInWithEmailAndPassword(auth,e,p);
  }catch(x){$('err').textContent=msgErr(x.code)}
};
$('out').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  $('auth').style.display=u?'none':'flex';
  $('chat').style.display=u?'flex':'none';
  if(!u)return;
  const q=query(collection(db,'messages'),orderBy('ts','asc'),limit(200));
  unsub=onSnapshot(q,s=>{
    const list=$('list'),near=list.scrollHeight-list.scrollTop-list.clientHeight<150;
    list.textContent='';
    s.forEach(d=>{
      const m=d.data(),mine=m.uid===u.uid,el=document.createElement('div');
      el.className='m'+(mine?' me':'');
      if(!mine){const n=document.createElement('div');n.className='n';n.textContent=m.name||'Wani';el.append(n)}
      const x=document.createElement('div');x.textContent=m.text;el.append(x);
      const t=document.createElement('div');t.className='t';
      t.textContent=m.ts?m.ts.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
      el.append(t);list.append(el);
    });
    if(near||s.size)list.scrollTop=list.scrollHeight;
  });
});

$('f').onsubmit=async e=>{
  e.preventDefault();
  const v=$('i').value.trim(),u=auth.currentUser;
  if(!v||!u)return;
  $('i').value='';
  try{await addDoc(collection(db,'messages'),{uid:u.uid,name:u.displayName||'Wani',text:v.slice(0,2000),ts:serverTimestamp()})}
  catch(x){$('i').value=v}
};
</script>
</body></html>
